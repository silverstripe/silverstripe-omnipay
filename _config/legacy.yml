---
Name: silverstripe-omnipay-legacy
---
# Map pre-namespace (3.x) model class names to their current classes.
#
# Legacy message subclasses (eg. `PurchaseRequest` or `SilverStripe\Omnipay\Model\Message\PurchaseRequest`) are
# deliberately NOT listed here: remapping them would discard the message type before it can be migrated.
# They are converted by SilverStripe\Omnipay\Migration\PaymentMessageMigrator, which runs on dev/build.
SilverStripe\Dev\Command\DbBuild:
  classname_value_remapping:
    Payment: SilverStripe\Omnipay\Model\Payment
    PaymentMessage: SilverStripe\Omnipay\Model\Message\PaymentMessage
